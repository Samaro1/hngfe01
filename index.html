<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo Card - Stage 0</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <!-- Card Container -->
  <article data-testid="test-todo-card" class="todo-card">

    <!-- Header Section -->
    <header class="todo-header">

      <!-- Checkbox -->
      <div class="todo-checkbox">
        <input 
          type="checkbox" 
          id="todo-complete"
          data-testid="test-todo-complete-toggle"
        >
        <label for="todo-complete"></label>
      </div>

      <!-- Title -->
      <h2 data-testid="test-todo-title">
        Build Todo Card UI
      </h2>

      <!-- Action Buttons -->
      <div class="todo-actions">
        <button 
          type="button" 
          data-testid="test-todo-edit-button"
          aria-label="Edit task"
        >
          ✎
        </button>

        <button 
          type="button" 
          data-testid="test-todo-delete-button"
          aria-label="Delete task"
        >
          🗑
        </button>
      </div>

    </header>

    <!-- Description -->
    <section class="todo-description-section">
      <p data-testid="test-todo-description">
        Design and implement a clean, interactive task card with dynamic time tracking and priority styling.
      </p>
    </section>

    <!-- Meta Info -->
    <section class="todo-meta">

      <!-- Priority -->
      <span 
        data-testid="test-todo-priority" 
        class="priority priority-high"
      >
        High
      </span>

      <!-- Status -->
      <span 
        data-testid="test-todo-status"
        class="status"
      >
        In Progress
      </span>

    </section>

    <!-- Time Section -->
    <section class="todo-time">

      <div>
        <strong>Due Date:</strong>
        <time 
          datetime="2026-04-15T23:59:59"
          data-testid="test-todo-due-date"
        >
          Apr 15, 2026
        </time>
      </div>

      <div>
        <strong>Time Remaining:</strong>
        <time data-testid="test-todo-time-remaining">
          Calculating...
        </time>
      </div>

    </section>

    <!-- Tags -->
    <section class="todo-tags-section">

      <ul data-testid="test-todo-tags" role="list" class="tags">

        <li data-testid="test-todo-tag-work">Work</li>
        <li data-testid="test-todo-tag-personal">Personal</li>
        <li data-testid="test-todo-tag-backend">Frontend</li>

      </ul>
    </section>

  </article>

  <script src="index.js"></script>
</body>
</html>
