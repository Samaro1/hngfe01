<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Todo Card - Stage 1A</title>
  <link rel="stylesheet" href="index.css" />
</head>

<body>

<article data-testid="test-todo-card" class="todo-card">

  <!-- VIEW MODE WRAPPER -->
  <section data-testid="test-todo-view" class="todo-view">

    <header class="todo-header">

      <input
        type="checkbox"
        data-testid="test-todo-complete-toggle"
      />

      <h2 data-testid="test-todo-title">Build Interactive Todo Card UI</h2>

      <div class="todo-actions">
        <button data-testid="test-todo-edit-button">✎</button>
        <button data-testid="test-todo-delete-button">🗑</button>
      </div>
    </header>

    <!-- DESCRIPTION -->
    <section class="todo-description-wrapper">

      <div data-testid="test-todo-collapsible-section">
        <p data-testid="test-todo-description">
          Design and implement a clean interactive task card.
        </p>
      </div>

      <button 
        data-testid="test-todo-expand-toggle"
        class="expand-btn"
      >
        Expand
      </button>

    </section>

    <!-- META -->
    <section class="todo-meta">

      <span data-testid="test-todo-priority" class="priority priority-high">High</span>
      <span data-testid="test-todo-priority-indicator"></span>

      <span data-testid="test-todo-status" class="status">In Progress</span>

      <select data-testid="test-todo-status-control">
        <option value="pending">Pending</option>
        <option value="in-progress">In Progress</option>
        <option value="done">Done</option>
      </select>

    </section>

    <!-- TIME -->
  <section class="todo-time">

    <div>
      <strong>Due Date:</strong>
      <time
        datetime="2026-04-15T23:59:59"
        data-testid="test-todo-due-date"
      >
        Apr 15, 2026
      </time>
    </div>

    <div>
      <strong>Time Remaining:</strong>
      <time data-testid="test-todo-time-remaining">
        Calculating...
      </time>
    </div>

    <span
      data-testid="test-todo-overdue-indicator"
      class="overdue hidden"
    >
      Overdue
    </span>

</section>

  </section>

  <!-- EDIT MODE -->
  <section data-testid="test-todo-edit-form" class="edit-form hidden">

    <input data-testid="test-todo-edit-title-input" />

    <textarea data-testid="test-todo-edit-description-input"></textarea>

    <select data-testid="test-todo-edit-priority-select">
      <option value="low">Low</option>
      <option value="medium">Medium</option>
      <option value="high">High</option>
    </select>

    <input type="datetime-local"
      data-testid="test-todo-edit-due-date-input" />

    <button data-testid="test-todo-save-button">Save</button>
    <button data-testid="test-todo-cancel-button">Cancel</button>

  </section>

  <!-- TAGS -->
  <ul data-testid="test-todo-tags" class="tags">
    <li>Work</li>
    <li>Frontend</li>
  </ul>

</article>

<script src="index.js"></script>
</body>
</html>
