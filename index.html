<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo Card - Stage 0</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <article class="card-container" data-testid="test-todo-card">

    <div class="top-bar">
      <div>
        <input 
          type="checkbox" 
          id="complete" 
          data-testid="test-todo-complete-toggle"
        >
        <label for="complete">Mark as complete</label>
      </div>

      <h2 data-testid="test-todo-title">
        Build Todo Card UI
      </h2>

      <div class="action-buttons">
        <button data-testid="test-todo-edit-button" aria-label="Edit task">✎</button>
        <button data-testid="test-todo-delete-button" aria-label="Delete task">🗑</button>
      </div>

      <p data-testid="test-todo-description">
        Design and implement a clean, interactive task card with time tracking and priority styling.
      </p>

      <span class="priority-label priority-medium" data-testid="test-todo-priority">
        Medium
      </span>

      <span class="status-label" data-testid="test-todo-status">
        In Progress
      </span>

    </div>

    <hr>

    <div class="mid-bar">

      <span>Due Date</span>
      <span>Time Remaining</span>

      <time 
        datetime="2026-04-13" 
        data-testid="test-todo-due-date"
      >
        Apr 13, 2026
      </time>

      <time data-testid="test-todo-time-remaining">
        Calculating...
      </time>

    </div>

    <div class="last-bar">
      <h3>Tags</h3>

      <ul class="tags-container" data-testid="test-todo-tags">
        <li class="tag" data-testid="test-todo-tag-work">Work</li>
        <li class="tag" data-testid="test-todo-tag-personal">Personal</li>
        <li class="tag" data-testid="test-todo-tag-backend">Backend</li>
      </ul>
    </div>

  </article>

  <script src="index.js"></script>
</body>
</html>
